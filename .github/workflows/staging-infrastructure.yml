name: Staging infrastructure

on:
  pull_request:
    branches: [staging]
    types: [opened, synchronize, reopened, closed]
    paths:
      - '.railway/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/staging-infrastructure.yml'

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  plan:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: railwayapp/config@9e17d413dbe219f19d62538d9c06b5dbb5e9abf8
        with:
          command: plan
          cli-version: '5.45.3'
          railway-token: ${{ secrets.RAILWAY_STAGING_TOKEN }}
          artifact-name: foundry-staging-plan
          confirm-destructive: 'false'
  apply:
    if: github.event.action == 'closed' && github.event.pull_request.merged && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: railwayapp/config@9e17d413dbe219f19d62538d9c06b5dbb5e9abf8
        with:
          command: apply
          cli-version: '5.45.3'
          railway-token: ${{ secrets.RAILWAY_STAGING_TOKEN }}
          artifact-name: foundry-staging-plan
          confirm-destructive: 'false'
